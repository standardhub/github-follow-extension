<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <h2>GitHub Follow Bot</h2>

    <div class="settings-section">
      <h3>Limits</h3>
      <div class="setting-row">
        <label for="maxProcessed">Max Processed:</label>
        <input type="number" id="maxProcessed" value="10000" min="1">
      </div>
      <div class="setting-row">
        <label for="maxFollowed">Max Followed:</label>
        <input type="number" id="maxFollowed" value="500" min="1">
      </div>
      <div class="setting-row">
        <label for="delayMin">Delay Min (s):</label>
        <input type="number" id="delayMin" value="8" min="1" max="60">
      </div>
      <div class="setting-row">
        <label for="delayMax">Delay Max (s):</label>
        <input type="number" id="delayMax" value="16" min="1" max="60">
      </div>
    </div>

    <div class="settings-section">
      <h3>Regions (uncheck all = follow all)</h3>
      <div class="checkbox-row">
        <label><input type="checkbox" id="regionNorthAmerica" checked> North America</label>
      </div>
      <div class="checkbox-row">
        <label><input type="checkbox" id="regionSouthAmerica"> South America</label>
      </div>
      <div class="checkbox-row">
        <label><input type="checkbox" id="regionEurope" checked> Europe</label>
      </div>
      <div class="checkbox-row">
        <label><input type="checkbox" id="regionAsia"> Asia</label>
      </div>
      <div class="checkbox-row">
        <label><input type="checkbox" id="regionAfrica"> Africa</label>
      </div>
      <div class="checkbox-row">
        <label><input type="checkbox" id="regionOceania"> Oceania</label>
      </div>
    </div>

    <div class="settings-section">
      <h3>Save Results</h3>
      <div class="checkbox-row">
        <label><input type="checkbox" id="saveResults"> Save followed users to file</label>
      </div>
      <button id="saveSettings" class="btn-save">Save Settings</button>
    </div>

    <div class="status-section">
      <p>Status: <span id="status">Stopped</span></p>
      <p>Followed: <span id="followCount">0</span></p>
      <p>Already Followed: <span id="skipCount">0</span></p>
      <p>Processed: <span id="processedCount">0</span></p>
      <p>Pages: <span id="pageCount">0</span></p>
    </div>

    <div class="controls">
      <button id="startBtn" class="btn-start">Start</button>
      <button id="stopBtn" class="btn-stop" disabled>Stop</button>
    </div>

    <div class="controls">
      <button id="downloadBtn">Download Results</button>
    </div>

    <div class="info">
      <p>Make sure you're logged into GitHub first</p>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
